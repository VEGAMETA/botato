[package]
name = "relay"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.11"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
proto = { version = "0.1.0", path = "../crates/proto" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tokio-util = "0.7.19"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
