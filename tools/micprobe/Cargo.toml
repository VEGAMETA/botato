[package]
name = "micprobe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Windows microphone probe: which capture endpoints WASAPI opens, with which flags and formats"

# Standalone: a tiny diagnostic exe, not part of the main workspace.
[workspace]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
