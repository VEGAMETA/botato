name: botato
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.5+14

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  botato_core:
    path: rust_builder
  connectivity_plus: ^7.3.1
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  # 1.6.2+hotfix.3 with a WASAPI microphone capture on Windows (botatoWasapi,
  # common/cpp/include/mic_capture.h): libwebrtc's own capture records silence on some
  # laptop mic arrays.
  flutter_webrtc:
    path: third_party/flutter_webrtc
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.3
  local_notifier: ^0.1.6
  pasteboard: ^0.5.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  record: ^7.1.1
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.2
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/potato.png
    - assets/icon/tray.ico
    - assets/sounds/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/legacy.png"
  adaptive_icon_background: "#0E1A22"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 24
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/potato.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/legacy.png"
