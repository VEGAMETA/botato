[package]
name = "proto"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
getrandom = "0.4"
hex = "0.4.3"
hkdf = "0.13"
hmac = "0.13"
k256 = { version = "0.14.0", default-features = false, features = ["schnorr", "alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "3"
hex = "0.4.3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
