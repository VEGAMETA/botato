[package]
name = "proto"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
getrandom = "0.4"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "3"
hex = "0.4.3"
