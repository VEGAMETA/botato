# Copy to inventory.ini (gitignored) and fill in.
[relay]
vpn-srv ansible_host=203.0.113.10 relay_domain=relay.example.org root_pub=CHANGE_ME_admin_root_pub_hex

[relay:vars]
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/deploy_ed25519
ansible_pipelining=true
ansible_python_interpreter=/usr/bin/python3
# Optional: signed manifest from `admin manifest sign`, path inside WSL.
# admin_manifest=/mnt/c/Users/me/botato-admin/manifest.bin
# fcm_credentials=/mnt/c/Users/me/botato-admin/fcm-service-account.json
