- name: Check required variables
  ansible.builtin.assert:
    that:
      - relay_domain is defined
      - root_pub is defined and root_pub | length == 64
    fail_msg: set relay_domain and root_pub (admin root public key, hex) in inventory.ini

# ---- relay image: built on the control machine, the VPS is too small to compile Rust

- name: Image tag from git
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.command: git -C {{ repo_root }} describe --always --dirty
  register: git_rev
  changed_when: false

- name: Set image tag
  ansible.builtin.set_fact:
    relay_tag: "{{ git_rev.stdout }}"

- name: Is the image already on the server
  ansible.builtin.command: docker image inspect {{ relay_image }}:{{ relay_tag }}
  register: image_present
  changed_when: false
  failed_when: false

- name: Build and ship the relay image
  when: image_present.rc != 0 or relay_tag is search('dirty')
  block:
    - name: Build locally
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.command: >
        docker build -q -f infra/Dockerfile.relay -t {{ relay_image }}:{{ relay_tag }} .
      args:
        chdir: "{{ repo_root }}"

    - name: Save locally
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.command: docker save -o /tmp/botato-relay.tar {{ relay_image }}:{{ relay_tag }}

    # The build can outlast the SSH control socket; a new connection needs a fresh knock.
    - name: Knock again after the build
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/knock.yml"

    - name: Upload
      ansible.builtin.copy:
        src: /tmp/botato-relay.tar
        dest: /tmp/botato-relay.tar
        mode: "0600"

    - name: Load
      ansible.builtin.command: docker load -i /tmp/botato-relay.tar

    - name: Remove the upload
      ansible.builtin.file:
        path: /tmp/botato-relay.tar
        state: absent

# ---- directories and secrets (generated on the server, never leave it)

- name: Directories
  tags: [app, manifest, release]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ botato_dir }}", mode: "0755" }
    - { path: "{{ botato_dir }}/relay", owner: "{{ relay_uid }}", mode: "0700" }
    # Encrypted attachments, ≤24 h; the relay wipes it at start (its key lives in RAM only).
    - { path: "{{ botato_dir }}/files", owner: "{{ relay_uid }}", mode: "0700" }
    - { path: "{{ botato_dir }}/config", mode: "0755" }
    - { path: "{{ botato_dir }}/releases", mode: "0755" }
    - { path: "{{ botato_dir }}/coturn", group: "{{ coturn_gid }}", mode: "0750" }
    - { path: "{{ botato_dir }}/coturn/certs", group: "{{ coturn_gid }}", mode: "0750" }

- name: TURN secret
  ansible.builtin.shell: umask 077 && openssl rand -hex 32 > {{ botato_dir }}/relay/turn_secret
  args:
    creates: "{{ botato_dir }}/relay/turn_secret"

- name: TURN secret ownership
  ansible.builtin.file:
    path: "{{ botato_dir }}/relay/turn_secret"
    owner: "{{ relay_uid }}"
    mode: "0400"

- name: Read TURN secret
  ansible.builtin.slurp:
    src: "{{ botato_dir }}/relay/turn_secret"
  register: turn_secret_raw
  no_log: true

- name: Server key (created on first run) and its public part
  ansible.builtin.command: >
    docker run --rm --network none --user {{ relay_uid }}
    -v {{ botato_dir }}/relay:/secrets {{ relay_image }}:{{ relay_tag }}
    keygen --key /secrets/server.key
  register: server_pub
  changed_when: false

- name: Placeholder TURN TLS cert until Caddy has the real one
  ansible.builtin.command: >
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 7
    -subj /CN={{ relay_domain }}
    -keyout {{ botato_dir }}/coturn/certs/key.pem -out {{ botato_dir }}/coturn/certs/crt.pem
  args:
    creates: "{{ botato_dir }}/coturn/certs/crt.pem"

- name: TURN cert ownership
  ansible.builtin.file:
    path: "{{ botato_dir }}/coturn/certs/{{ item }}"
    owner: "{{ coturn_uid }}"
    group: "{{ coturn_gid }}"
    mode: "0400"
  loop: [crt.pem, key.pem]

- name: FCM service account (push); stays in the admin dir and on the server only
  when: fcm_credentials is defined and fcm_credentials is file
  ansible.builtin.copy:
    src: "{{ fcm_credentials }}"
    dest: "{{ botato_dir }}/relay/fcm.json"
    owner: "{{ relay_uid }}"
    mode: "0400"
  no_log: true

- name: Is push configured
  ansible.builtin.stat:
    path: "{{ botato_dir }}/relay/fcm.json"
  register: fcm_file

# The relay re-reads the manifest every 30 s: `--tags manifest` alone is enough to publish one.
- name: Signed manifest from the admin machine
  when: admin_manifest is defined and admin_manifest is file
  tags: [app, manifest]
  ansible.builtin.copy:
    src: "{{ admin_manifest }}"
    dest: "{{ botato_dir }}/config/manifest.bin"
    mode: "0644"

# App updates, served by Caddy under /releases/. Trusted by clients only through the admin
# signature in release.bin (protocol/README.md §3b). `--tags release` publishes a new one.
- name: Release files from the admin machine
  when: admin_releases is defined and admin_releases is directory
  tags: [app, release]
  block:
    - name: Upload release files
      ansible.builtin.copy:
        src: "{{ admin_releases }}/"
        dest: "{{ botato_dir }}/releases/"
        mode: "0644"

    - name: Current release file names
      ansible.builtin.set_fact:
        release_names: "{{ lookup('ansible.builtin.fileglob', admin_releases + '/*', wantlist=True) | map('basename') | list }}"

    # Only the current release stays on the server (find skips the "latest" symlinks).
    - name: List published release files
      ansible.builtin.find:
        paths: "{{ botato_dir }}/releases"
      register: published

    - name: Remove release files the admin folder no longer has
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ published.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename) not in release_names

    # Stable download links for people: /releases/botato-latest.apk and .exe.
    - name: Stable "latest" links to the current files
      ansible.builtin.file:
        src: "{{ item.target }}"
        dest: "{{ botato_dir }}/releases/{{ item.link }}"
        state: link
        force: true
      loop:
        - { link: botato-latest.apk, target: "{{ release_names | select('match', '^botato-.*\\.apk$') | first | default('') }}" }
        - { link: botato-latest.exe, target: "{{ release_names | select('match', '^botato-setup-.*\\.exe$') | first | default('') }}" }
      loop_control:
        label: "{{ item.link }} -> {{ item.target }}"
      when: item.target != ''

# ---- configs

- name: compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ botato_dir }}/compose.yml"
    mode: "0644"

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ botato_dir }}/Caddyfile"
    mode: "0644"
  register: caddyfile

- name: turnserver.conf
  ansible.builtin.template:
    src: turnserver.conf.j2
    dest: "{{ botato_dir }}/coturn/turnserver.conf"
    owner: "{{ coturn_uid }}"
    group: "{{ coturn_gid }}"
    mode: "0400"
  diff: false
  register: turnconf

- name: Pick the compose command
  ansible.builtin.shell: docker compose version >/dev/null 2>&1 && echo "docker compose" || echo docker-compose
  register: compose_bin
  changed_when: false

- name: Start
  ansible.builtin.command: "{{ compose_bin.stdout }} -p botato up -d --remove-orphans"
  args:
    chdir: "{{ botato_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr or 'Created' in compose_up.stderr"

- name: Restart services whose mounted config changed
  ansible.builtin.command: "{{ compose_bin.stdout }} -p botato restart {{ item.svc }}"
  args:
    chdir: "{{ botato_dir }}"
  # Single-file bind mounts keep showing the old file after Ansible rewrites it, so restart
  # whenever the config changed, even if `up` recreated other containers in the same run.
  when: item.changed
  loop:
    - { svc: caddy, changed: "{{ caddyfile.changed }}" }
    - { svc: coturn, changed: "{{ turnconf.changed }}" }

# ---- Caddy's certificate for coturn (TURN over TLS)

- name: Cert sync script
  ansible.builtin.template:
    src: botato-turn-certs.sh.j2
    dest: /usr/local/sbin/botato-turn-certs
    mode: "0755"

- name: Cert sync units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: botato-turn-certs.service
      content: |
        [Unit]
        Description=Copy Caddy's certificate to coturn
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/botato-turn-certs
    - name: botato-turn-certs.timer
      content: |
        [Unit]
        Description=Daily coturn certificate sync
        [Timer]
        OnCalendar=daily
        RandomizedDelaySec=1h
        Persistent=true
        [Install]
        WantedBy=timers.target

- name: Cert sync timer enabled
  ansible.builtin.systemd:
    name: botato-turn-certs.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Caddy to obtain the certificate
  ansible.builtin.shell: >
    ls /var/lib/docker/volumes/botato_caddy_data/_data/caddy/certificates/*/{{ relay_domain }}/{{ relay_domain }}.crt
  register: caddy_cert
  until: caddy_cert.rc == 0
  retries: 18
  delay: 10
  changed_when: false
  failed_when: false

- name: Sync the certificate now
  ansible.builtin.command: /usr/local/sbin/botato-turn-certs
  when: caddy_cert.rc == 0
  changed_when: false

- name: Report
  ansible.builtin.debug:
    msg:
      - "server_pub: {{ server_pub.stdout }}"
      - "TLS cert: {{ 'ok' if caddy_cert.rc == 0 else 'NOT YET (check DNS and port 443)' }}"
      - "Add to the manifest: admin manifest server-add --url wss://{{ relay_domain }}/ws --pub-key {{ server_pub.stdout }} --ip {{ ansible_host }}"
